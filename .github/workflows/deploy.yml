name: Auto Deploy AVGfx

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
        - name: Deploy to VPS
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            port: 22
            timeout: 30s
            command_timeout: 10m
            script: |
              cd /home/stacodev/apps/AVGfx

              echo "Resetting local changes..."
              git fetch origin
              git reset --hard origin/main
              git clean -fd

              echo "Backend setup..."
              cd backend
              npm install
              pm2 restart backend || pm2 start server.js --name backend

              echo "Frontend build..."
              cd ../frontend
              npm install
              npm run build

              echo "Reload nginx..."
              sudo systemctl reload nginx

              echo "Deploy completed!"
